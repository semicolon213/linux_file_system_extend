<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileScope R2 화면</title>
<!--
  FileScope R2 화면 시안 (U-10). 검색 결과·확장자 거르기, 주소 입력(Ctrl+L, U-11), 휴지통 목록·확인,
  전체 이력·삭제 파일 복원·이력 끔, 텍스트 미리보기·편집·저장 충돌, 트레이 감시 경로 4개 이상.
  상태: 위쪽 전환줄 또는 ?s=<상태>. 토큰·컴포넌트 CSS는 main-window.html에서 그대로 가져왔다(바꾸지 않음).
-->
<style>
:root{
  --bg:#10151c; --bg-2:#141b24; --raise:#18202a; --hover:#1c2632; --line:#263241; --line-soft:#1b2430;
  --ink:#e6e9ee; --ink-2:#b9c1cc; --dim:#8a94a3;
  --up:#f0525a; --up-wash:rgba(240,82,90,.11); --up-flash:rgba(240,82,90,.42);
  --down:#4d9bff; --down-wash:rgba(77,155,255,.11); --down-flash:rgba(77,155,255,.40);
  --sel:#f5c84b; --sel-wash:rgba(245,200,75,.10); --line-float:#33435a; --vol-mid:#5f6a7a;
  --add:#3fb950; --add-wash:rgba(63,185,80,.14); --del:#f85149; --del-wash:rgba(248,81,73,.14);
  --sans:"Ubuntu","Noto Sans KR","Noto Sans CJK KR","Cantarell",system-ui,sans-serif;
  --mono:"Ubuntu Mono","Noto Sans Mono","DejaVu Sans Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --sidebar:240px; --insp:440px; --log:232px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);caret-color:var(--sel)}
::selection{background:var(--sel);color:var(--bg)}
*{scrollbar-width:thin;scrollbar-color:#2f3d4f transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2f3d4f;border:3px solid var(--bg);border-radius:6px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;height:100vh;min-width:1024px;grid-template-rows:48px 34px minmax(0,1fr) var(--log) 28px}

/* 헤더바 */
.hb{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--raise);border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:transparent;cursor:pointer;color:var(--ink-2)}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default;background:transparent}
.btn[aria-pressed="true"]{color:var(--ink);border-color:#3a4a5e;background:var(--hover)}
.btn.primary{border-color:var(--ink-2);color:var(--ink)}
.grp{display:flex;gap:4px}
.crumb{display:flex;align-items:center;min-width:0;overflow:hidden}
.crumb button{border:0;background:none;padding:4px 6px;border-radius:4px;color:var(--dim);cursor:pointer;white-space:nowrap}
.crumb button:hover{color:var(--ink);background:var(--hover)}
.crumb button[aria-current]{color:var(--ink);font-weight:600;font-size:14px}
.crumb .ico{width:12px;height:12px;color:#3d4c5f}
.search{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:4px;width:220px;color:var(--dim)}
.search input{border:0;background:none;outline:0;width:100%;color:var(--ink)}
.search:focus-within{border-color:var(--sel)}
.metrics{margin-left:auto;display:flex;align-items:baseline;gap:18px;white-space:nowrap;color:var(--dim);font-size:12px}
.metrics b{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}

/* 탭 */
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--bg)}
.tab{display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;border:0;border-right:1px solid var(--line-soft);background:none;color:var(--dim);cursor:pointer;max-width:220px}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--sel)}
.tab .x{display:inline-flex;padding:2px;border-radius:3px;color:var(--dim)}.tab .x:hover{color:var(--ink);background:var(--hover)}
.tab .x .ico{width:12px;height:12px}
.tab-add{border:0;background:none;color:var(--dim);padding:0 12px;cursor:pointer}.tab-add:hover{color:var(--ink)}

/* 작업 영역 */
.work{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr) var(--insp);min-height:0}
.app.no-insp .work{grid-template-columns:var(--sidebar) minmax(0,1fr) 0}
.app.no-insp .insp{display:none}

.side{border-right:1px solid var(--line);overflow:auto;padding:8px 0 16px}
.side h2{font-size:11px;font-weight:600;color:var(--dim);padding:14px 16px 6px}
.side h2:first-child{padding-top:6px}
.side ul{list-style:none}
.node{display:flex;align-items:center;gap:6px;width:100%;padding:4px 12px 4px calc(12px + var(--d,0) * 14px);border:0;background:none;text-align:left;cursor:pointer;color:var(--ink-2)}
.node:hover{background:var(--hover);color:var(--ink)}
.node[aria-current="true"]{background:var(--sel-wash);color:var(--ink);box-shadow:inset 0 1px 0 var(--sel),inset 0 -1px 0 var(--sel)}
.node .tw{width:12px;height:12px;color:var(--dim)}
.node .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .cnt{font-family:var(--mono);font-size:12px}
.watch-dot{width:7px;height:7px;border-radius:50%;background:var(--ink);flex:none}
.watch-dot.off{background:transparent;border:1px solid var(--dim)}

/* 목록 */
.list{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.scroller{overflow:auto;flex:1;min-height:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
.files th{position:sticky;top:0;z-index:1;background:var(--bg);font-size:12px;font-weight:500;color:var(--dim);text-align:left;padding:0;border-bottom:1px solid var(--line);height:32px}
.files th button{width:100%;height:32px;padding:0 12px;border:0;background:none;text-align:inherit;cursor:pointer;color:inherit;display:flex;align-items:center;gap:4px}
.files th.r button{justify-content:flex-end}
.files th button:hover{color:var(--ink)}
.files th[aria-sort] button{color:var(--ink)}
.files th .ico{width:10px;height:10px}
.r{text-align:right}
.files td{height:34px;padding:0 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color 1.6s ease}
.files tr{cursor:default}
.files tbody tr:hover td{background:var(--hover)}
.nm{display:flex;align-items:center;gap:8px;min-width:0}
.nm span{overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:500}
.nm .ico{color:var(--dim)}
.files tr.dir .nm span{font-weight:600}
.files tr[aria-selected="true"] td{background:var(--sel-wash);box-shadow:inset 0 1px 0 var(--sel),inset 0 -1px 0 var(--sel)}
.files tr.recent-up td{background:var(--up-wash)}
.files tr.recent-down td{background:var(--down-wash)}
.files tr.tick-up td{animation:tick-up .6s var(--ease)}
.files tr.tick-down td{animation:tick-down .6s var(--ease)}
@keyframes tick-up{from{background:var(--up-flash)}to{background:var(--up-wash)}}
@keyframes tick-down{from{background:var(--down-flash)}to{background:var(--down-wash)}}
.files tr.gone td{color:var(--dim)}
.files tr.gone .nm span,.files tr.gone td.c-size{text-decoration:line-through;text-decoration-color:var(--down)}
.files tr.leaving{opacity:0;transition:opacity .6s ease}
.c-ev{font-family:var(--mono);font-size:12px;letter-spacing:.02em}

.band{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);color:var(--bg);font-weight:500}
.band .ico{stroke-width:2}
.band .btn{margin-left:auto;height:26px;border-color:var(--bg);color:var(--bg)}
.band .btn:hover{background:rgba(16,21,28,.1);color:var(--bg)}
.band.quiet .btn:hover{background:var(--hover);color:var(--ink)}
.band.quiet{background:var(--raise);color:var(--ink);border-bottom:1px solid var(--line)}
.band.quiet .btn{border-color:var(--line);color:var(--ink)}
.empty{padding:56px 32px;max-width:520px}
.empty h3{font-size:16px;font-weight:600;margin-bottom:8px}
.empty p{color:var(--ink-2);margin-bottom:16px}
.empty code{font-family:var(--mono);background:var(--raise);padding:2px 6px;border-radius:3px}
.skel td span{display:block;height:10px;border-radius:2px;background:linear-gradient(90deg,var(--raise),#212c39,var(--raise));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* 변경 내용 패널 */
.insp{display:flex;flex-direction:column;min-height:0;background:var(--bg-2)}
.insp-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.insp-head:empty{display:none}
.part summary{list-style:none;cursor:pointer}.part summary::-webkit-details-marker{display:none}
.part summary h4 .tw{width:12px;height:12px;color:var(--dim);transition:transform .15s var(--ease)}.part[open] summary h4 .tw{transform:rotate(90deg)}
.files td.num.up,.files td.num.down{font-weight:600}
.list.stale .files td{background:none!important;color:var(--dim)}.list.stale .files .up,.list.stale .files .down{color:var(--dim)}
.insp-name{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.insp-path{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;color:var(--ink-2);font-size:12px}
.insp-meta .ev{font-family:var(--mono);font-weight:600}
.insp-actions{display:flex;gap:6px;margin-top:12px}
.insp-body{overflow:auto;flex:1;min-height:0;padding:12px 16px 20px}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-bottom:12px}
.summary b{font-family:var(--mono);font-weight:600}
.part{margin-bottom:16px}
.part h4{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.part h4 .tag{font-family:var(--mono);font-weight:600}
.diff{font-family:var(--mono);font-size:12.5px;line-height:1.6;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.diff div{display:grid;grid-template-columns:34px 34px 16px 1fr;white-space:pre-wrap;word-break:break-all}
.diff .ln{color:var(--dim);text-align:right;padding-right:6px;user-select:none}
.diff .hunk{display:block;color:var(--dim);background:var(--raise);padding:2px 8px}
.diff .a{background:var(--add-wash)}.diff .a .g{color:var(--add)}
.diff .d{background:var(--del-wash)}.diff .d .g{color:var(--del)}
.prose{border:1px solid var(--line);border-radius:4px;padding:10px 12px;line-height:1.7;color:var(--ink-2)}
.prose ins{text-decoration:none;background:var(--add-wash);color:#b6f0bf;box-shadow:inset 0 -1px 0 var(--add)}
.prose del{background:var(--del-wash);color:#ffc2bd;text-decoration-color:var(--del)}
.prose ins::before{content:"+";color:var(--add);font-family:var(--mono);margin-right:1px}
.prose del::before{content:"−";color:var(--del);font-family:var(--mono);margin-right:1px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#0c1016}
.pair figcaption{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:4px 8px;border-top:1px solid var(--line)}
.pair figcaption b{font-weight:600;color:var(--ink-2)}
.pair figure.was{border-color:rgba(248,81,73,.5)}.pair figure.now{border-color:rgba(63,185,80,.5)}
.pair svg,.swipe svg{display:block;width:100%;height:auto}
.swipe{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#0c1016}
.swipe .top{position:absolute;inset:0;clip-path:inset(0 0 0 var(--cut,50%))}
.swipe .handle{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:var(--ink);transform:translateX(-1px)}
.swipe-ctl{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--dim)}
.swipe-ctl input{flex:1;accent-color:var(--sel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:none;padding:3px 10px;font-size:12px;color:var(--dim);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:12px;margin-top:10px}
.facts dt{color:var(--dim)}.facts dd{font-family:var(--mono)}
.confirm{margin-top:12px;padding:10px 12px;border:1px solid var(--ink-2);border-radius:4px;font-size:12px;color:var(--ink-2)}
.confirm div{display:flex;gap:6px;margin-top:8px}
.note{color:var(--ink-2);line-height:1.6}

/* 하단 로그 */
.log{display:grid;grid-template-columns:minmax(0,1fr) 260px;border-top:1px solid var(--line);background:var(--bg-2);min-height:0}
.log-main{display:flex;flex-direction:column;min-height:0}
.log-bar{display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;border-bottom:1px solid var(--line)}
.log-bar h2{font-size:13px;font-weight:600;margin-right:6px}
.ptabs{display:flex;align-self:stretch;margin-right:8px}
.ptabs button{border:0;background:none;padding:0 10px;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer}
.ptabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--sel)}
.ptabs button:hover{color:var(--ink)}
.chart-only{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.chart-only[hidden]{display:none}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
.legend .sep{width:1px;height:14px;background:var(--line);margin:0 6px}
.up-fill{background:var(--up)}.down-fill{background:var(--down)}.mid-fill{background:var(--vol-mid)}
.chart{position:relative;flex:1;min-height:0}
.chart svg{display:block;width:100%;height:100%}
.chart .grid{stroke:var(--line-soft);stroke-width:1}
.chart .axis{fill:var(--dim);font:11px var(--mono)}
.chart .now-line{stroke:var(--ink-2);stroke-dasharray:3 3;stroke-width:1}
.chart .cross{stroke:var(--ink-2);stroke-dasharray:3 3;stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover+g .body{stroke:var(--ink);stroke-width:1}
.tip{position:absolute;pointer-events:none;padding:8px 10px;background:var(--raise);border:1px solid var(--line-float);border-radius:4px;font:12px/1.55 var(--sans);color:var(--ink);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.tip b{font-family:var(--mono);font-weight:600}
.tip .num{font-size:12px}
.chip{height:24px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--dim);cursor:pointer;font-size:12px}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-2)}
.log-bar .search{width:200px;height:26px;margin-left:auto}
.events td{height:24px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.events td.t{color:var(--dim);width:118px}
.events td.e{width:110px;font-weight:600}
.events td.x{width:150px;text-align:right;color:var(--ink-2)}
.events tr{cursor:pointer}.events tr:hover td{background:var(--hover)}
.events tr.fresh td{animation:fresh 1.2s var(--ease)}
@keyframes fresh{from{background:#243041}to{background:transparent}}
.tally{border-left:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.tally h2{font-size:13px;font-weight:600}
.tally dl{display:grid;grid-template-columns:1fr auto;row-gap:4px;align-items:baseline}
.tally dt{color:var(--dim);font-size:12px}
.tally dd{font-family:var(--mono);font-size:19px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tally dd i{font-style:normal;font-size:13px;margin-right:6px;vertical-align:2px}
.band.ovf{padding:4px 8px 4px 12px;font-size:12px}
.band.ovf[hidden]{display:none}

.status{display:flex;align-items:center;gap:20px;padding:0 12px;border-top:1px solid var(--line);background:var(--raise);color:var(--dim);font-size:12px;white-space:nowrap}
.status .sp{margin-left:auto}

/* 컨텍스트 메뉴, 토스트 */
.menu{position:fixed;z-index:20;min-width:220px;padding:4px;background:var(--raise);border:1px solid var(--line-float);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.menu[hidden]{display:none}
.menu button{display:flex;justify-content:space-between;width:100%;padding:6px 10px;border:0;background:none;border-radius:4px;cursor:pointer;text-align:left;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:0}
.menu kbd{font-family:var(--mono);font-size:11px;color:var(--dim)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.empty code{white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(var(--log) + 44px);transform:translate(-50%,8px);opacity:0;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 14px;background:var(--raise);color:var(--ink);border:1px solid var(--line-float);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .btn{height:26px}

@media (max-width:1439px){:root{--insp:380px}}
@media (max-width:1279px){:root{--sidebar:200px;--insp:320px}.hb .search{width:160px}.metrics .lat{display:none}.files col:nth-child(4),.files col:nth-child(6){width:0!important}.files th:nth-child(4),.files td:nth-child(4),.files th:nth-child(6),.files td:nth-child(6){padding:0;font-size:0;visibility:hidden}}
@media (max-height:800px){:root{--log:196px}}
@media (prefers-reduced-motion:reduce){
  .files tr.tick-up td,.files tr.tick-down td,.events tr.fresh td,.skel td span{animation:none}
  .files td,.files tr.leaving,.toast{transition:none}
}

/* ===== R2 화면 추가 (main-window.html 토큰·컴포넌트를 그대로 쓴다) ===== */
.proto{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;background:#0b0f14;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;font-size:12px;color:var(--dim);scrollbar-width:none}
.proto b{color:var(--ink-2);font-weight:600;margin-right:6px}
.proto .chip{height:22px;padding:0 8px;font-size:11.5px}
.proto .sep{width:1px;height:14px;background:var(--line);margin:0 4px;flex:none}
.app{height:calc(100vh - 36px)}

/* 주소 입력 (Ctrl+L) */
.addr{display:flex;align-items:center;gap:6px;flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid var(--sel);border-radius:4px}
.addr input{flex:1;min-width:0;border:0;background:none;outline:0;font-family:var(--mono);font-size:13px;color:var(--ink)}
.addr kbd{font-family:var(--mono);font-size:11px;color:var(--dim)}
.search.on{border-color:var(--ink-2);color:var(--ink-2)}
.search .x{display:inline-flex;border:0;background:none;color:var(--dim);cursor:pointer;padding:2px;border-radius:3px}
.search .x:hover{color:var(--ink);background:var(--hover)}
.search .x .ico{width:12px;height:12px}

/* 검색 결과 */
.fbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.fbar .lbl{font-size:12px;color:var(--dim);margin-right:4px}
.chip .n{font-family:var(--mono);font-size:11.5px;margin-left:5px;color:var(--dim)}
.chip[aria-pressed="true"] .n{color:var(--ink-2)}
.fbar .clear{margin-left:auto;border:0;background:none;color:var(--dim);font-size:12px;cursor:pointer;padding:2px 4px;border-radius:3px}
.fbar .clear:hover{color:var(--ink);background:var(--hover)}
.loc{font-family:var(--mono);font-size:12px;color:var(--dim)}
.nm mark{background:none;color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--ink-2);text-underline-offset:3px}
.band .num{font-size:12.5px}
.band .meta{display:flex;gap:14px;color:var(--ink-2);font-size:12px}
.band .meta b{font-family:var(--mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.spin{width:14px;height:14px;flex:none;border:2px solid var(--line-float);border-top-color:var(--ink);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-radius:3px;color:var(--ink-2)}

/* 휴지통 */
.tbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.tbar h3{font-size:14px;font-weight:600;margin-right:6px}
.tbar .cnt{font-size:12px;color:var(--dim)}
.tbar .btn{height:26px}
.tbar .sp{margin-left:auto}
.files .ck{width:16px;height:16px;accent-color:var(--sel);vertical-align:-3px}

/* 확인 대화상자: 영구 삭제처럼 되돌릴 수 없는 작업만 */
.dlg-back{position:fixed;inset:36px 0 0;background:rgba(5,8,12,.62);display:grid;place-items:center;z-index:30}
.dlg{width:440px;padding:18px 20px 16px;background:var(--raise);border:1px solid var(--line-float);border-radius:6px;box-shadow:0 16px 48px rgba(0,0,0,.55)}
.dlg h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin-bottom:8px}
.dlg p{color:var(--ink-2);line-height:1.6}
.dlg .first{margin:12px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.dlg .first span{color:var(--dim)}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg .btn{height:32px;padding:0 14px}
.btn.danger{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:600}
.btn.danger:hover{background:var(--ink-2);color:var(--bg)}

/* 전체 이력 */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--dim);cursor:pointer;font-size:12px;padding:2px 4px;margin-left:-4px;border-radius:3px}
.back:hover{color:var(--ink);background:var(--hover)}
.back .ico{width:12px;height:12px}
.vers{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
.vers th{font-size:11px;font-weight:500;color:var(--dim);text-align:left;padding:0 8px 6px;border-bottom:1px solid var(--line)}
.vers td{height:34px;padding:0 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vers td.v{font-family:var(--mono);font-weight:600}
.vers td.t,.vers td.s{font-family:var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.vers td.d{font-family:var(--mono);font-weight:600;text-align:right}
.vers tbody tr{cursor:pointer}.vers tbody tr:hover td{background:var(--hover)}
.vers tr[aria-selected="true"] td{background:var(--sel-wash);box-shadow:inset 0 1px 0 var(--sel),inset 0 -1px 0 var(--sel)}
.vers .cur{font-family:var(--sans);font-weight:500;font-size:11px;color:var(--dim);margin-left:6px}
.vers .ev{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.foot-note{margin-top:12px;font-size:12px;color:var(--dim);line-height:1.6}

/* 미리보기·편집 */
.modebar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--dim)}
.modebar .ro{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.modebar .ro .ico{width:12px;height:12px}
.modebar .btn{height:26px;margin-left:auto}
.code{font-family:var(--mono);font-size:12.5px;line-height:1.6;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.code div{display:grid;grid-template-columns:38px 1fr;white-space:pre-wrap;word-break:break-all}
.code .ln{color:var(--dim);text-align:right;padding-right:10px;user-select:none}
.code.edit{border-color:var(--sel)}
.code.edit .cur-line{background:var(--hover)}
.code.edit .caret{display:inline-block;width:2px;height:1.1em;background:var(--sel);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.code.dimmed{opacity:.55}
.dirty{font-family:var(--mono);color:var(--ink);font-weight:600}

/* 띠 안의 짧은 설명 상자(조용한 상자): 되돌리기 확인과 같은 형식 */
.confirm h5{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px}
.confirm h5 .ico{stroke-width:2}
.confirm p{line-height:1.6}
.confirm .stamps{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 2px;font-size:12px}
.confirm .stamps dt{color:var(--dim)}.confirm .stamps dd{font-family:var(--mono);color:var(--ink)}
.confirm .btn{height:28px}
.confirm .sub{display:block;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.confirm .sub div{display:flex;gap:6px;margin-top:8px}

/* 이력 끔 */
.status .off{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.status .off .ico{width:13px;height:13px}

/* 트레이 감시 경로 4개 이상 */
.tray-stage{display:flex;flex-wrap:wrap;gap:24px 32px;justify-content:center;align-content:flex-start;padding:40px 24px;height:100%;overflow:auto;background:
  linear-gradient(180deg,#1b1f26,#0e1116)}
.tray-stage h4{flex:0 0 100%;text-align:center;font-size:12px;font-weight:500;color:var(--dim)}
.win{width:360px;background:var(--bg);border:1px solid var(--line-float);border-radius:6px;box-shadow:0 16px 48px rgba(0,0,0,.55);overflow:hidden;align-self:start}
.win .whb{display:flex;align-items:center;height:40px;padding:0 6px 0 14px;background:var(--raise);border-bottom:1px solid var(--line)}
.win .whb h3{font-size:13px;font-weight:600}
.win .whb button{margin-left:auto;width:28px;height:28px;border:0;background:none;color:var(--dim);border-radius:4px;display:grid;place-items:center}
.win .wst{display:flex;align-items:center;gap:9px;padding:14px 16px 12px;font-size:16px;font-weight:600}
.win .wst .dot{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.win .wst small{margin-left:auto;font-size:12px;font-weight:400;color:var(--dim)}
.win .wst small b{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);margin:0 2px 0 6px}
.paths{list-style:none;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.paths li{display:flex;align-items:center;gap:10px;padding:7px 16px}
.paths li+li{border-top:1px solid var(--line-soft)}
.paths .ico{color:var(--dim)}
.paths .p{font-family:var(--mono);font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.paths .m{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
.paths .more button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:12px;padding:0;text-align:left}
.paths .more button:hover{color:var(--ink)}
.paths .more .ico{width:12px;height:12px;transition:transform .15s var(--ease)}
.paths .more button[aria-expanded="true"] .ico{transform:rotate(90deg)}
.paths.scroll{max-height:calc(7 * 35px);overflow:auto}
.win .wfoot{padding:10px 16px 14px;font-size:12px;color:var(--dim)}
.nmenu{width:300px;padding:6px 0;background:#2b2b2b;border:1px solid #3c3c3c;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);font:14px/1.4 var(--sans);color:#f2f2f2;align-self:start}
.nmenu div{padding:5px 16px}
.nmenu .dis{color:#9a9a9a}
.nmenu .mono{font-family:var(--mono);font-size:13px}
.nmenu hr{border:0;border-top:1px solid #3e3e3e;margin:5px 0}

@media (prefers-reduced-motion:reduce){.spin,.code.edit .caret{animation:none}.paths .more .ico{transition:none}}
</style>

<!-- 시안 전용 상태 전환줄. 앱 화면의 일부가 아니다. ?s=<상태> 로도 연다. -->

      <span>감시 경로<b>3</b></span>

      <span class="lat">반영 지연 P95<b>38ms</b></span>
    </div>
    <div class="grp">
      <button class="btn" aria-pressed="true" aria-label="변경 내용 패널"><svg class="ico"><use href="#i-panel"/></svg></button>

    <button class="tab" role="tab" aria-selected="false">src<span class="x" aria-label="탭 닫기"><svg class="ico"><use href="#i-x"/></svg></span></button>
    <button class="tab-add" aria-label="새 탭"><svg class="ico"><use href="#i-plus"/></svg></button>

  <div class="work" id="work">

        <li><button class="node" style="--d:1"><svg class="ico tw"><use href="#i-chev"/></svg><span class="lbl">src</span></button></li>

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = (n, extra = '') => `<svg class="ico" ${extra}><use href="#i-${n}"/></svg>`;
const kindIco = n => /\.(png|jpg|svg)$/.test(n) ? 'image' : /\.(c|h|cpp|hpp|py|sh)$/.test(n) ? 'code' : /\.(md|txt|log)$/.test(n) ? 'text' : 'bin';

/* ---------- 상태 목록 ---------- */
const STATES = [
  ['검색', [['search-run', '검색 중'], ['search-done', '완료 · .md 거르기'], ['search-none', '결과 없음'], ['addr', '주소 입력 Ctrl+L']]],
  ['휴지통', [['trash', '목록'], ['trash-conflict', '복원 충돌'], ['trash-confirm', '비우기 확인'], ['trash-empty', '빈 휴지통']]],
  ['이력', [['hist', '전체 이력'], ['hist-deleted', '삭제된 파일'], ['hist-none', '버전 없음'], ['hist-off', '이력 끔']]],
  ['미리보기', [['pre', '읽기 전용'], ['pre-edit', '편집 중'], ['pre-conflict', '저장 충돌'], ['pre-overwrite', '덮어쓰기 확인'], ['pre-bad', '열 수 없음'], ['pre-big', '크기 한도']]],
  ['트레이', [['tray', '감시 경로 4개 이상']]],
];
const ALL = STATES.flatMap(g => g[1].map(s => s[0]));
let S = new URLSearchParams(location.search).get('s');
if (!ALL.includes(S)) S = 'search-done';

$('proto').innerHTML = STATES.map(([g, list], i) =>
  (i ? '<span class="sep"></span>' : '') + `<b>${g}</b>` +
  list.map(([k, l]) => `<button class="chip" data-s="${k}">${l}</button>`).join('')).join('');
$('proto').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) go(b.dataset.s); });
const go = s => { S = s; history.replaceState(null, '', '?s=' + s); render(); };

/* ---------- 공용 조각 ---------- */
const crumb = (parts) => `<nav class="crumb" aria-label="현재 경로">
  <button aria-label="홈">${ico('home', 'style="width:14px;height:14px;color:inherit"')}</button>
  ${parts.map((p, i) => `${ico('chev')}<button ${i === parts.length - 1 ? 'aria-current="page"' : ''}>${esc(p)}</button>`).join('')}</nav>`;
const searchBox = (val = '') => `<label class="search${val ? ' on' : ''}">${ico('search')}<span class="sr">이 폴더에서 검색</span><input placeholder="이 폴더에서 검색" value="${esc(val)}">${val ? `<button class="x" aria-label="검색 지우기 (Esc)">${ico('x')}</button>` : ''}</label>`;
const status = (cells) => cells.map((c, i) => i === 2 ? `<span class="sp">${c}</span>` : `<span>${c}</span>`).join('');
const defStatus = (a, b) => status([a, b, '이력 보관 128 MB', '디스크 여유 41.2 GB', 'inotify watch <span class="num">214 / 8192</span>']);

const EVENTS = [
  ['14:31:52.418', '▲ 수정', 'up', 'filescope/README.md', '+240 B'],

    body.innerHTML = `<div class="summary"><span>외부에서 삭제됨</span><span>마지막 크기 <b>22.0 KB</b></span></div>

      <p class="foot-note">복원하면 원래 위치에 v2 내용으로 다시 만듭니다. 그 사이 같은 이름의 파일이 생겼다면 덮어쓰지 않습니다.</p>`;
    return;
  }
  if (S === 'hist-none') {
    head.innerHTML = fileHead('tmp_scan.o', '~/projects/filescope/tmp_scan.o', `<span class="ev down">✕ 삭제</span><span class="num">14:31:27</span>`, '');
    body.innerHTML = `<div class="empty" style="padding:24px 0"><h3>복구할 버전이 없습니다</h3>
      <p>이 파일은 보관 한도(8 MiB)를 넘었거나 감시를 시작하기 전에 만들어져 이력에 버전이 없습니다. 다른 탐색기의 휴지통을 확인해 보세요.</p></div>`;
    return;
  }
  if (S === 'hist-off') {
    $('status').innerHTML = status(['9개 항목', 'README.md 선택',
      `<span class="off">${ico('warn')}이력 꺼짐</span>`, '디스크 여유 41.2 GB', 'inotify watch <span class="num">214 / 8192</span>']);
    center.insertAdjacentHTML('afterbegin', `<div class="band quiet" role="status">${ico('warn')}<span>이력 저장소를 열 수 없어 이번 실행에서는 버전을 보관하지 않습니다. 탐색·감시·파일 작업은 그대로 됩니다.</span><button class="btn">자세히</button></div>`);
    head.innerHTML = readmeHead(`<span class="ev up">▲ 수정</span><span class="num">14:31:52</span><span>+240 B</span>`, '');
    body.innerHTML = `<div class="empty" style="padding:24px 0"><h3>이력이 꺼져 있어 변경 내용을 비교할 수 없습니다</h3>
      <p>이력 폴더 <code>~/.local/share/filescope</code>에 쓸 권한이 없습니다. 권한을 고친 뒤 FileScope를 다시 시작하면 그때부터 버전을 보관합니다.</p>
      <p class="flat" style="font-size:12px">무엇이 바뀌었는지(이벤트, 크기 변동)는 목록과 이벤트 로그에 계속 나타납니다.</p></div>`;
    return;
  }

  /* 미리보기 */
  if (S === 'pre') {
    head.innerHTML = readmeHead(stdMeta, `<button class="btn">변경 내용</button><button class="btn" aria-pressed="true">미리보기</button>`);
    body.innerHTML = `<div class="modebar"><span class="ro">${ico('lock')}읽기 전용</span><span>UTF-8 · <span class="num">14</span>줄 · 4.9 KB</span><button class="btn">${ico('edit')}편집 <span class="kbd">F4</span></button></div>` + codeBlock(DOC);
    return;
  }
  if (S === 'pre-edit') {
    const lines = DOC.slice(); lines[13] = '대기열이 넘치면 다시 검사해 맞춘다. 맞춘 시각은';
    head.innerHTML = readmeHead(`<span class="dirty">● 저장 안 됨</span><span>편집 시작 14:33:10 (v7 기준)</span>`, `<button class="btn primary">저장 <span class="kbd">Ctrl+S</span></button><button class="btn">편집 취소</button>`);
    body.innerHTML = `<div class="modebar"><span class="ro">${ico('edit')}편집 중</span><span>UTF-8 · 14줄</span></div>` + codeBlock(lines, 'edit', 13);
    return;
  }
  if (S === 'pre-conflict' || S === 'pre-overwrite') {
    const lines = DOC.slice(); lines[13] = '대기열이 넘치면 다시 검사해 맞춘다. 맞춘 시각은';
    head.innerHTML = readmeHead(`<span class="dirty">● 저장 안 됨</span><span>편집 시작 14:33:10 (v7 기준)</span>`, '');
    const sub = S === 'pre-overwrite' ? `<div class="sub"><p>디스크의 v8 내용을 이 편집본으로 바꿉니다. v8은 이력에 남아 나중에 되돌릴 수 있습니다.</p>
        <div><button class="btn" id="ow-cancel">돌아가기</button><button class="btn danger">v8 위에 덮어쓰기</button></div></div>` : '';
    body.innerHTML = `<div class="confirm" role="alertdialog" aria-labelledby="cf-t" aria-describedby="cf-d" style="margin:0 0 12px">
      <h5 id="cf-t">${ico('warn')}편집하는 동안 다른 프로그램이 이 파일을 바꿨습니다</h5>
      <p id="cf-d">지금 저장하면 그 변경을 덮어씁니다. 어떻게 할지 고르세요.</p>
      <dl class="stamps"><dt>편집 기준</dt><dd>v7 · 14:31:52 · 4.9 KB</dd><dt>디스크 지금</dt><dd>v8 · 14:34:02 · 5.1 KB (+184 B)</dd></dl>
      <div><button class="btn" ${S === 'pre-conflict' ? 'id="cf-cancel"' : ''}>취소</button><button class="btn">${ico('reload')}다시 읽기</button><button class="btn">덮어쓰기…</button></div>
      ${sub}</div>
      <p class="foot-note" style="margin:0 0 10px">취소: 편집을 이어 가고 디스크 내용은 그대로 둡니다. 다시 읽기: 편집본을 버리고 v8을 엽니다.</p>` + codeBlock(lines, 'edit dimmed', 13);
    setTimeout(() => (S === 'pre-overwrite' ? $('ow-cancel') : $('cf-cancel'))?.focus(), 0);
    return;
  }
  if (S === 'pre-bad' || S === 'pre-big') {
    const bad = S === 'pre-bad';
    head.innerHTML = fileHead(bad ? 'dump.dat' : 'build-full.log', bad ? '~/projects/filescope/dump.dat' : '~/projects/filescope/build-full.log', '', '');
    body.innerHTML = `<div class="empty" style="padding:24px 0"><h3>${bad ? '텍스트로 열 수 없습니다' : '미리보기 한도(4 MiB)를 넘는 파일입니다'}</h3>
      <p>${bad ? 'UTF-8이 아닌 바이트(첫 위치 <code>0x1f40</code>)나 NUL 문자가 들어 있습니다. 내용을 바꾸지 않도록 미리보기와 편집을 막았습니다.' : '이 파일은 <span class="num">18.6 MB</span>입니다. 앱이 멈추지 않도록 미리보기와 편집은 4 MiB까지만 합니다.'}</p>
      <dl class="facts"><dt>크기</dt><dd>${bad ? '2,048 KB' : '19,503,211 B'}</dd><dt>종류</dt><dd>${bad ? '알 수 없는 바이너리' : '텍스트 로그'}</dd></dl>
      <div style="margin-top:14px"><button class="btn">기본 프로그램으로 열기</button></div></div>`;
  }
}

/* ---------- 트레이 ---------- */
function renderTray() {
  $('app').style.display = 'none';
  const stage = document.createElement('div');
  stage.className = 'tray-stage';
  stage.style.height = 'calc(100vh - 36px)';
  const P = [['~/projects/filescope', '하위 폴더 포함'], ['~/notes', '하위 폴더 포함'], ['~/.config/app', '이 폴더만'],
    ['~/projects/website', '하위 폴더 포함'], ['~/Downloads', '이 폴더만'], ['/srv/shared/team-docs/2026', '하위 폴더 포함']];
  const li = ([p, m]) => `<li>${ico('folder')}<span class="p" title="${esc(p)}">${esc(p)}</span><span class="m">${m}</span></li>`;
  stage.innerHTML = `<h4>요약 창: 감시 경로가 3개를 넘으면 3개만 보이고 “외 N개”로 접는다. 펼치면 최대 7행까지 보이고 그 이상은 이 목록만 스크롤한다.</h4>
    <section class="win" aria-label="FileScope 요약 (접힘)"><div class="whb"><h3>FileScope 요약</h3><button aria-label="요약 닫기">${ico('x')}</button></div>
      <div class="wst"><span class="dot"></span>감시 중<small>최근 1분<b>9</b>건</small></div>
      <ul class="paths" aria-label="감시 경로 6개">${P.slice(0, 3).map(li).join('')}
        <li class="more"><button aria-expanded="false">${ico('chev')}외 <span class="num">3</span>개 경로 더 보기</button></li></ul>
      <div class="wfoot">(아래 집계·최근 변경은 tray.html과 같다)</div></section>
    <section class="win" aria-label="FileScope 요약 (펼침)"><div class="whb"><h3>FileScope 요약</h3><button aria-label="요약 닫기">${ico('x')}</button></div>
      <div class="wst"><span class="dot"></span>감시 중<small>최근 1분<b>9</b>건</small></div>
      <ul class="paths scroll" aria-label="감시 경로 6개">${P.map(li).join('')}
        <li class="more"><button aria-expanded="true">${ico('chev')}접기</button></li></ul>
      <div class="wfoot">(아래 집계·최근 변경은 tray.html과 같다)</div></section>
    <h4>네이티브 트레이 메뉴: 메뉴는 펼칠 수 없으므로 3개 뒤에 “외 N개 (요약에서 보기)”를 비활성 줄로 둔다.</h4>
    <div class="nmenu" role="menu" aria-label="FileScope 트레이 메뉴">
      <div class="dis">● 감시 중 · 최근 1분 9건</div><hr>
      ${P.slice(0, 3).map(([p]) => `<div class="dis mono">${esc(p)}</div>`).join('')}
      <div class="dis">외 3개 경로 (요약에서 보기)</div><hr>
      <div class="dis">▲ README.md 14:31:52</div><div class="dis">▲ build.log 14:31:49</div><div class="dis">● event_queue.h 14:31:37</div><hr>
      <div>요약 열기</div><div>메인 창 열기</div><hr><div>감시 일시 정지</div><div>감시 폴더 변경…</div><hr><div>FileScope 종료</div></div>`;
  document.body.appendChild(stage);
}
const _render = render;
render = function () { $('app').style.display = ''; _render(); };

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S === 'trash-confirm') go('trash');
  else if (S === 'pre-overwrite') go('pre-conflict');
});
render();
})();
</script>
</body>
</html>
